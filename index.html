<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albion Painel – Craft para o Black Market</title>
    <script>
      // Aplica o tema salvo ANTES do React carregar, para a tela
      // não "piscar" branca quando o tema escolhido é o escuro.
      try {
        if (localStorage.getItem('albion-painel:tema') === 'escuro') {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body class="bg-stone-100 text-stone-800 transition-colors dark:bg-stone-950 dark:text-stone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
